name: Auto Sports Writer
on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Groq
        run: pip install groq

      - name: Run AI Writer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat << 'EOF' > write.py
          import os
          from groq import Groq
          from datetime import datetime

          client = Groq(api_key=os.environ.get("GROQ_API_KEY"))
          
          prompt = "Write an original 800-word sports analysis article about Arsenal vs Chelsea. Sections: Form, Tactical Preview, Forecast. NEVER use the words bet, odds, or wager. End with: '> This article is for informational purposes only.'"
          
          response = client.chat.completions.create(
              messages=[{"role": "user", "content": prompt}],
              model="llama-3.3-70b-versatile",
              temperature=0.6
          )
          body = response.choices[0].message.content
          
          today = datetime.now().strftime("%Y-%m-%d")
          filename = f"src/content/blog/{today}-auto-article.md"
          
          with open(filename, "w") as f:
              f.write(f"---\ntitle: 'Match Analysis: Arsenal vs Chelsea'\ndescription: 'Data-driven preview'\npubDate: {today}\ndraft: false\n---\n\n{body}")
          EOF
          python write.py

      - name: Commit and Push
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@example.com"
          git add src/content/blog/*
          git commit -m "AI generated new article"
          git push
